name: Android CI — Build & Unit/Robolectric Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compile APK & Run Robolectric Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Default .env from .env.example
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Generate Debug Keystore if Missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salahmate-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: salahmate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
